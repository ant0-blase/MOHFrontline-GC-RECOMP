name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Verify no retail game data is tracked
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -Eii '\.(iso|gcm|rvz|wbfs|wia)$|(^|/)HD/PS3_FILES/' || true)"
          if [[ -n "$bad" ]]; then
            echo "::error::Retail game/remaster data must never be tracked:"
            echo "$bad"
            exit 1
          fi

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n build.sh run.sh
          find scripts tools -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Validate Python tools
        run: python3 -m compileall -q tools

      - name: Validate changelog release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/extract_changelog.py CHANGELOG.md --version v0.0.1 --output /tmp/v0.0.1-notes.md
          test -s /tmp/v0.0.1-notes.md
          grep -q "Static recompilation core" /tmp/v0.0.1-notes.md

      - name: Validate minimal portable payload
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python3 tools/stage_portable_payload.py --source "$PWD" --destination "$tmp"
          test -f "$tmp/scripts/build-portable.sh"
          test -f "$tmp/scripts/build-portable.ps1"
          test -f "$tmp/tools/build_all_exec_module.py"
          test -f "$tmp/multi-module-template/CMakeLists.txt"
          test -f "$tmp/ModernGekko/vendor/dolphin/GXRuntime/src/core/cpu.c"
          test -f "$tmp/ModernGekko/vendor/dolphin/Source/Core/Core/PowerPC/StaticRecomp/StaticRecompABI.h"
          test ! -e "$tmp/ModernGekko/vendor/dolphin/Externals"
          test ! -e "$tmp/ModernGekko/vendor/dolphin/Source/Core/VideoCommon"

  core-tests-linux:
    name: Core tests · Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake g++ python3
      - name: Configure game-independent tests
        run: >
          cmake -S ModernGekko -B build/ci-core-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMODERNGEKKO_ENABLE_DOLPHIN_RUNTIME=OFF
          -DMODERNGEKKO_ENABLE_DOLPHIN_TESTS=OFF
          -DMODERNGEKKO_ENABLE_NOD_DISC=ON
          -DBUILD_TESTING=ON
          -DDOLRECOMP_ENABLE_LLVM=OFF
      - name: Build
        run: cmake --build build/ci-core-linux --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-core-linux --output-on-failure --timeout 120

  core-tests-windows:
    name: Core tests · Windows
    runs-on: windows-2022
    steps:
      - name: Enable Win32 long paths for Git
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Configure game-independent tests
        shell: pwsh
        run: |
          cmake -S ModernGekko -B build/ci-core-windows `
            -G "Visual Studio 17 2022" -A x64 `
            -DMODERNGEKKO_ENABLE_DOLPHIN_RUNTIME=OFF `
            -DMODERNGEKKO_ENABLE_DOLPHIN_TESTS=OFF `
            -DMODERNGEKKO_ENABLE_NOD_DISC=ON `
            -DBUILD_TESTING=ON `
            -DDOLRECOMP_ENABLE_LLVM=OFF
      - name: Build
        run: cmake --build build/ci-core-windows --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-core-windows -C Release --output-on-failure --timeout 120

  runtime-linux:
    name: Runtime · Linux x86_64 · nod direct-disc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Configure production runtime
        run: >
          cmake -S ModernGekko -B build/ci-runtime-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DMODERNGEKKO_ENABLE_DOLPHIN_RUNTIME=ON
          -DMODERNGEKKO_ENABLE_DOLPHIN_TESTS=OFF
          -DMODERNGEKKO_ENABLE_NOD_DISC=ON
          -DMODERNGEKKO_REQUIRED_DISC_ID=GMFE69
          "-DMODERNGEKKO_DEFAULT_WINDOW_TITLE=Medal of Honor: Frontline"
      - name: Build production runtime
        run: cmake --build build/ci-runtime-linux --target moderngekko-run --parallel 2
      - name: Verify runtime payload
        shell: bash
        run: |
          set -euo pipefail
          RUNNER="$(find build/ci-runtime-linux -type f -name moderngekko-run -perm -111 | head -n1)"
          test -n "$RUNNER"
          test -d "$(dirname "$RUNNER")/Sys"

  runtime-windows:
    name: Runtime · Windows x86_64 · nod direct-disc
    runs-on: windows-2022
    steps:
      - name: Enable Win32 long paths for Git
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      - name: Configure production runtime
        shell: pwsh
        run: |
          cmake -S ModernGekko -B build/ci-runtime-windows `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DBUILD_TESTING=OFF `
            -DMODERNGEKKO_ENABLE_DOLPHIN_RUNTIME=ON `
            -DMODERNGEKKO_ENABLE_DOLPHIN_TESTS=OFF `
            -DMODERNGEKKO_ENABLE_NOD_DISC=ON `
            -DMODERNGEKKO_REQUIRED_DISC_ID=GMFE69 `
            "-DMODERNGEKKO_DEFAULT_WINDOW_TITLE=Medal of Honor: Frontline"
      - name: Build production runtime
        run: cmake --build build/ci-runtime-windows --config Release --target moderngekko-run --parallel 2
      - name: Verify runtime payload
        shell: pwsh
        run: |
          $runner = Get-ChildItem build/ci-runtime-windows -Filter moderngekko-run.exe -Recurse | Select-Object -First 1
          if (!$runner) { throw "moderngekko-run.exe was not produced" }
          if (!(Test-Path (Join-Path $runner.DirectoryName "Sys"))) { throw "runtime Sys directory is missing" }

  launcher-linux:
    name: Launcher · Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install launcher dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Build standalone recompilation launcher
        run: ./scripts/build-launcher.sh
      - name: Stage artifact
        run: |
          mkdir -p dist/launcher-linux
          install -m755 launcher/bin/MOHFrontline-Launcher dist/launcher-linux/
          install -m755 launcher/bin/MOHFrontline-DiscCache dist/launcher-linux/
          cp LICENSE dist/launcher-linux/
      - uses: actions/upload-artifact@v4
        with:
          name: MOHFrontline-Launcher-Linux-x86_64
          path: dist/launcher-linux
          if-no-files-found: error
          retention-days: 14

  portable-toolchain-windows:
    name: Portable toolchain · Windows DLL link
    runs-on: windows-2022
    steps:
      - name: Enable Win32 long paths for Git
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      - name: Stage bundled Windows toolchain
        shell: pwsh
        run: |
          python tools/stage_portable_toolchain.py --root build/portable-smoke --platform windows
          if ($LASTEXITCODE -ne 0) { throw "portable toolchain staging failed" }
          $zigVersion = & build/portable-smoke/toolchain/zig/zig.exe version
          if ($LASTEXITCODE -ne 0) { throw "zig version probe failed" }
          Write-Host "Bundled Zig: $zigVersion"
          if ($zigVersion.Trim() -ne "0.15.1") { throw "unexpected Windows Zig version: $zigVersion" }
      - name: Create DLL link smoke project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/portable-smoke-src | Out-Null
          @'
          cmake_minimum_required(VERSION 3.16)
          project(moh_portable_link_smoke C)
          add_library(moh_portable_link_smoke SHARED smoke.c)
          target_compile_options(moh_portable_link_smoke PRIVATE -O3 -flto=thin)
          target_link_options(moh_portable_link_smoke PRIVATE -flto=thin)
          '@ | Set-Content build/portable-smoke-src/CMakeLists.txt
          @'
          #include <math.h>
          #include <stdint.h>
          #include <string.h>
          #include <wchar.h>

          #ifdef _WIN32
          #define API __declspec(dllexport)
          #else
          #define API
          #endif

          API float moh_portable_link_smoke(float value, wchar_t* out, const wchar_t* in)
          {
              int exponent = 0;
              float fraction = frexpf(value, &exponent);
              if (out && in)
                  wmemcpy(out, in, 1);
              return fraction + (float)exponent;
          }
          '@ | Set-Content build/portable-smoke-src/smoke.c
      - name: Configure portable DLL link smoke test
        shell: pwsh
        run: |
          $toolchain = Join-Path $PWD "build/portable-smoke/toolchain/moh-zig.cmake"
          & build/portable-smoke/toolchain/cmake/bin/cmake.exe `
            -S build/portable-smoke-src `
            -B build/portable-smoke-build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
          if ($LASTEXITCODE -ne 0) { throw "portable DLL smoke configure failed" }
      - name: Build and verify portable DLL
        shell: pwsh
        run: |
          & build/portable-smoke/toolchain/cmake/bin/cmake.exe `
            --build build/portable-smoke-build --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "portable DLL smoke link failed" }
          $dll = Get-ChildItem build/portable-smoke-build -Filter "*moh_portable_link_smoke.dll" -Recurse |
            Select-Object -First 1
          if (!$dll) {
            Write-Host "Portable smoke build outputs:"
            Get-ChildItem build/portable-smoke-build -File -Recurse |
              Select-Object -ExpandProperty FullName
            throw "portable DLL smoke test did not produce a DLL"
          }
          Write-Host "portable DLL link OK: $($dll.FullName)"
  launcher-windows:
    name: Launcher · Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Enable Win32 long paths for Git
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      - name: Configure standalone launcher
        shell: pwsh
        run: |
          cmake -S launcher -B build/launcher-ci `
            -G "Visual Studio 17 2022" -A x64
      - name: Build standalone launcher
        run: cmake --build build/launcher-ci --config Release --target MOHFrontline-Launcher MOHFrontline-DiscCache --parallel 2
      - name: Stage artifact
        shell: pwsh
        run: |
          $launcher = Get-ChildItem launcher/bin -Filter MOHFrontline-Launcher.exe -Recurse | Select-Object -First 1
          if (!$launcher) { throw "MOHFrontline-Launcher.exe was not produced" }
          New-Item -ItemType Directory -Force dist/launcher-windows | Out-Null
          $discCache = Get-ChildItem launcher/bin -Filter MOHFrontline-DiscCache.exe -Recurse | Select-Object -First 1
          if (!$discCache) { throw "MOHFrontline-DiscCache.exe was not produced" }
          Copy-Item $launcher.FullName dist/launcher-windows/MOHFrontline-Launcher.exe
          Copy-Item $discCache.FullName dist/launcher-windows/MOHFrontline-DiscCache.exe
          Copy-Item LICENSE dist/launcher-windows/
      - uses: actions/upload-artifact@v4
        with:
          name: MOHFrontline-Launcher-Windows-x86_64
          path: dist/launcher-windows
          if-no-files-found: error
          retention-days: 14
