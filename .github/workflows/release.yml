name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      replace_assets:
        description: "Replace assets if this release already exists"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mohfrontline-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v0.1.0"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    name: Package · Linux x86_64
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install launcher dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Build launcher
        run: ./scripts/build-launcher.sh
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          NAME="MOHFrontline-GC-RECOMP-${VERSION}-Linux-x86_64"
          mkdir -p "dist/$NAME"
          git archive --format=tar HEAD | tar -xf - -C "dist/$NAME"
          install -m755 launcher/bin/MOHFrontline-Launcher "dist/$NAME/MOHFrontline-Launcher"
          printf '%s\n' \
            "Medal of Honor: Frontline - GameCube Static Recompilation" \
            "Release: $VERSION" \
            "Platform: Linux x86_64" \
            "" \
            "No retail game data or PS3 assets are included." \
            "Start MOHFrontline-Launcher and select your own legally obtained GMFE69 ISO." \
            > "dist/$NAME/RELEASE.txt"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          sha256sum "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  windows:
    name: Package · Windows x86_64
    needs: validate
    runs-on: windows-2022
    steps:
      - name: Enable Win32 long paths for Git
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      - name: Configure launcher
        shell: pwsh
        run: |
          cmake -S launcher -B build/launcher-release `
            -G "Visual Studio 17 2022" -A x64
      - name: Build launcher
        run: cmake --build build/launcher-release --config Release --target MOHFrontline-Launcher --parallel 2
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "MOHFrontline-GC-RECOMP-$env:VERSION-Windows-x86_64"
          New-Item -ItemType Directory -Force dist, dist/add | Out-Null
          $zip = "dist/$name.zip"

          # Keep the source tree inside the ZIP without expanding its very long
          # SPIRV-Cross reference paths onto the Windows filesystem.
          git archive --format=zip --output $zip HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed" }

          $launcher = Get-ChildItem launcher/bin -Filter MOHFrontline-Launcher.exe -Recurse | Select-Object -First 1
          if (!$launcher) { throw "MOHFrontline-Launcher.exe was not produced" }
          Copy-Item $launcher.FullName dist/add/MOHFrontline-Launcher.exe
          @(
            "Medal of Honor: Frontline - GameCube Static Recompilation",
            "Release: $env:VERSION",
            "Platform: Windows x86_64",
            "",
            "No retail game data or PS3 assets are included.",
            "Start MOHFrontline-Launcher.exe and select your own legally obtained GMFE69 ISO."
          ) | Set-Content dist/add/RELEASE.txt

          $zipAbsolute = (Resolve-Path $zip).Path
          Push-Location dist/add
          try {
            7z a -tzip $zipAbsolute MOHFrontline-Launcher.exe RELEASE.txt | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "7z failed to append release files" }
          } finally {
            Pop-Location
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 2
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          REPLACE: ${{ inputs.replace_assets }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            if [[ "$REPLACE" != "true" ]]; then
              echo "::error::Release $VERSION already exists. Re-run with replace_assets=true."
              exit 1
            fi
            gh release upload "$VERSION" dist/* --clobber
            exit 0
          fi
          extra=()
          if [[ "$VERSION" == v0.* ]]; then extra+=(--prerelease); fi
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "MOHFrontline-GC-RECOMP $VERSION" \
            --generate-notes \
            "${extra[@]}"
